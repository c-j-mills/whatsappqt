id: io.bit3.WhatsAppQT
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
base: io.qt.qtwebengine.BaseApp
base-version: '6.10'
command: WhatsAppQT
finish-args:
  - "--share=ipc"
  - "--socket=wayland"
  - "--socket=fallback-x11"
  - "--socket=pulseaudio"
  - "--share=network"
  - "--filesystem=xdg-download"
  - "--device=dri"
  - "--device=all"                  # Allows camera / microphone access for calls
  - "--system-talk-name=org.freedesktop.NetworkManager" # Silences D-Bus system queries
  - "--env=QTWEBENGINEPROCESS_PATH=/app/bin/QtWebEngineProcess"
  - "--talk-name=org.kde.StatusNotifierWatcher"
  - "--own-name=org.kde.*"
cleanup-commands:
- /app/cleanup-BaseApp.sh
modules:
- name: WhatsAppQT
  buildsystem: qmake
  build-options:
    env:
    - QMAKEPATH=/app
  config-opts:
  - QMAKE_INCDIR+=/app/include/QtWebEngine
  - QMAKE_INCDIR+=/app/include/QtWebEngineCore
  - QMAKE_INCDIR+=/app/include/QtWebEngineWidgets
  sources:
  - type: dir
    path: .
